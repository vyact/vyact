name: CI

on:
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run all backend tests and frontend lint
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend core checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-test.txt

      - name: Install backend test dependencies
        run: python -m pip install -r app/requirements-test.txt

      - name: Compile Python source
        run: python -m compileall -q app

      - name: Run core backend tests
        if: ${{ !inputs.full_checks }}
        env:
          PYTHONPATH: app
        run: |
          mapfile -t tests < <(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' scripts/ci_backend_tests.txt)
          python -m pytest "${tests[@]}" -q

      - name: Run full backend suite
        if: ${{ inputs.full_checks }}
        env:
          PYTHONPATH: app
        run: python -m pytest app/tests -q

  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ inputs.full_checks }}
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload built frontend for Linux packaging
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/static
          if-no-files-found: error
          retention-days: 1

  windows-desktop:
    name: Windows desktop static checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Windows Electron entrypoint and package config
        shell: pwsh
        run: |
          node --check electron/main.js
          node --check electron/platform.js
          node --check electron/preload.js
          node -e "JSON.parse(require('fs').readFileSync('win/electron/package.json', 'utf8'))"
          node -e "const p=require('./electron/platform'); if(!p.isWindows || !p.bundledPython('C:/resources', true).endsWith('python.exe') || !p.installDir.startsWith(process.env.LOCALAPPDATA)) process.exit(1)"

      - name: Validate locale JSON and Windows Python path contract
        shell: pwsh
        run: |
          Get-ChildItem frontend/src/i18n/locales/*/settings.json | ForEach-Object {
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" $_.FullName
          }
          if (-not (Select-String -Quiet -Path electron/platform.js -SimpleMatch 'isWindows ? "python.exe"')) { throw "Bundled Windows Python path is missing" }
          if (Select-String -Quiet -Path electron/main.js,electron/platform.js -Pattern 'Ollama|Chocolatey') { throw "Legacy Windows bootstrap dependency remains" }
          if (Get-ChildItem frontend/src/i18n/locales -Recurse -File | Select-String -Pattern 'Ollama|Chocolatey|\bchoco\b') { throw "Legacy dependency text remains in locales" }
          if (-not (Select-String -Quiet -Path electron/platform.js -SimpleMatch 'process.env.LOCALAPPDATA')) { throw "Per-user Windows install path is missing" }
          if (Select-String -Quiet -Path electron/platform.js,app/config/__init__.py -SimpleMatch 'C:/.vyact','C:\.vyact') { throw "Legacy system-drive install path remains" }
          if (-not (Select-String -Quiet -Path electron/platform.js -SimpleMatch 'llama_cpp_python-0.3.34-py3-none-win_amd64.whl')) { throw "Prebuilt Windows llama-cpp-python wheel is missing" }
          if (-not (Select-String -Quiet -Path app/requirements.txt -Pattern '^llama-cpp-python==[^;]+;\s*sys_platform\s*!=\s*"win32"\s*$')) { throw "Windows llama-cpp-python source build is not excluded" }
          if (Test-Path win/electron/main.js) { throw "Platform-specific main.js must not be reintroduced" }

  linux-desktop:
    needs: frontend
    name: Linux desktop package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Download validated frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/static

      - name: Prepare bundled Python
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prepare_python_runtime.sh linux-x64

      - name: Restore bundled Linux model runtime
        id: linux-runtime-cache
        uses: actions/cache@v4
        with:
          path: electron/linux-runtime
          key: linux-runtime-ubuntu-22.04-x64-${{ hashFiles('scripts/prepare_linux_runtime.sh') }}

      - name: Build bundled Linux model runtime
        if: steps.linux-runtime-cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare_linux_runtime.sh

      - name: Validate bundled Linux model runtime
        run: |
          electron/linux-runtime/llama-server --version
          electron/linux-runtime/llama-swap --version

      - name: Build AppImage and deb packages
        working-directory: electron
        run: |
          npm ci
          npm run build:linux

      - name: Validate package artifacts
        run: |
          test -n "$(find electron/dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find electron/dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -f electron/dist/latest-linux.yml

      - name: Test Python runtime persistence
        run: |
          appimage_path="$(find "$PWD/electron/dist" -maxdepth 1 -name '*.AppImage' -print -quit)"
          extraction_dir="$(mktemp -d)"
          trap 'rm -rf "$extraction_dir"' EXIT
          (cd "$extraction_dir" && "$appimage_path" --appimage-extract > /dev/null)
          TEST_BUNDLED_PYTHON="$extraction_dir/squashfs-root/resources/python/bin/python3" node --test electron/tests/python-runtime.test.js

      - name: Verify clean Ubuntu installation and native dependencies
        run: |
          for image in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm \
              -v "$PWD/electron/dist:/packages:ro" \
              -v "$PWD/scripts/check_linux_package.sh:/check.sh:ro" \
              "$image" bash /check.sh
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: vyact-linux-x64
          if-no-files-found: error
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/latest-linux.yml
