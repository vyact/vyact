name: Bug Report
description: Report a reproducible problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected behavior and what actually happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your OS, browser, and app version.
      placeholder: e.g. macOS 15 / Chrome 140 / v1.2.0
    validations:
      required: true