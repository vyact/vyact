<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    body{margin:0;background:#0f1117;display:flex;align-items:center;
      justify-content:center;height:100vh;flex-direction:column;gap:12px;
      font-family:-apple-system,sans-serif;color:#e2e8f0;-webkit-app-region:drag;}
    .icon{font-size:44px;}
    h2{font-size:16px;font-weight:600;margin:0;color:#ef4444;}
    p{font-size:12px;color:#64748b;margin:0;text-align:center;max-width:340px;}
    #detail{font-size:11px;color:#f87171;background:#1a1d27;padding:6px 12px;
      border-radius:6px;margin-top:4px;max-width:340px;word-break:break-word;
      text-align:center;display:none;}
    code{font-size:11px;color:#818cf8;background:#1a1d27;padding:6px 12px;
      border-radius:6px;margin-top:8px;display:block;-webkit-app-region:no-drag;
      user-select:text;}
    button{margin-top:10px;padding:10px 18px;border:0;border-radius:8px;background:#6366f1;
      color:white;font-weight:600;cursor:pointer;-webkit-app-region:no-drag;}
    button:disabled{opacity:.6;cursor:default;}
  </style>
</head>
<body>
<div class="icon">⚠️</div>
<h2 id="title"></h2>
<p id="message"></p>
<p id="detail"></p>
<code id="log-path">~/.vyact/logs/</code>
<button id="retry" type="button"></button>

<script>
  // main.js가 mainWindow.loadFile(errorPath, {query: {msg, title}}) 형태로 넘긴
  // query에 실패 사유가 있으면 기본 문구와 함께 표시한다.
  const params = new URLSearchParams(window.location.search);
  const message = params.get('message');
  const detail = params.get('detail') || params.get('msg');
  const title = params.get('title');
  const retry = params.get('retry');
  if (title) document.getElementById('title').textContent = title;
  if (message) document.getElementById('message').textContent = message;
  if (detail) {
    const el = document.getElementById('detail');
    el.textContent = detail;
    el.style.display = 'block';
  }
  if (retry) document.getElementById('retry').textContent = retry;
  if (window.ragAPI && typeof window.ragAPI.getLogPath === 'function') {
    window.ragAPI.getLogPath().then((p) => {
      if (p) document.getElementById('log-path').textContent = p;
    }).catch(() => {});
  }
  document.getElementById('retry').addEventListener('click', async (event) => {
    event.currentTarget.disabled = true;
    await window.ragAPI?.retryStartup?.();
  });
</script>
</body>
</html>
