<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    body{margin:0;background:#0f1117;display:flex;align-items:center;
      justify-content:center;height:100vh;flex-direction:column;gap:12px;
      font-family:-apple-system,sans-serif;color:#e2e8f0;-webkit-app-region:drag;}
    .icon{font-size:44px;}
    h2{font-size:16px;font-weight:600;margin:0;color:#ef4444;}
    p{font-size:12px;color:#64748b;margin:0;text-align:center;max-width:340px;}
    #detail{font-size:11px;color:#f87171;background:#1a1d27;padding:6px 12px;
      border-radius:6px;margin-top:4px;max-width:340px;word-break:break-word;
      text-align:center;display:none;}
    code{font-size:11px;color:#818cf8;background:#1a1d27;padding:6px 12px;
      border-radius:6px;margin-top:8px;display:block;-webkit-app-region:no-drag;
      user-select:text;}
  </style>
</head>
<body>
<div class="icon">⚠️</div>
<h2 id="title">서버 시작 실패</h2>
<p>Python 환경이나 의존성 문제일 수 있습니다.<br>아래 로그 파일을 확인해 주세요.</p>
<p id="detail"></p>
<code id="log-path">~/.vyact/logs/</code>

<script>
  // main.js가 mainWindow.loadFile(errorPath, {query: {msg, title}}) 형태로 넘긴
  // query에 실패 사유가 있으면 기본 문구와 함께 표시한다.
  const params = new URLSearchParams(window.location.search);
  const msg = params.get('msg');
  const title = params.get('title');
  if (title) document.getElementById('title').textContent = title;
  if (msg) {
    const el = document.getElementById('detail');
    el.textContent = msg;
    el.style.display = 'block';
  }
  if (window.ragAPI && typeof window.ragAPI.getLogPath === 'function') {
    window.ragAPI.getLogPath().then((p) => {
      if (p) document.getElementById('log-path').textContent = p;
    }).catch(() => {});
  }
</script>
</body>
</html>
