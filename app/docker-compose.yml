version: '3.8'
name: vyact

services:
  elasticsearch:
    build: .
    container_name: vyact-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - cluster.name=rag-cluster
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - rag_es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9251:9200"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'" ]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: vyact-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - server.name=vyact-kibana
    ports:
      - "127.0.0.1:5651:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'" ]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  rag_es_data:
    driver: local
